name: Benchmark board

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Fixture benchmark and safety gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run benchmark board
        run: python3 bin/benchmark-board.py run --json

      - name: Run local red-team gate
        run: bash bin/redteam-gate.sh run --profile core --json

      - name: Inspect workflow posture
        run: python3 bin/ci-posture.py scan . --json

      - name: Publish board to workflow summary
        if: always()
        shell: bash
        run: |
          if [[ -f .factory/benchmarks/latest.md ]]; then
            cat .factory/benchmarks/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark board did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
